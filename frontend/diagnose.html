<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KrishiSmart - Diagnose</title><link rel="stylesheet" href="/style.css"></head>
<body><nav id="nav"></nav>
<div class="page-title"><h2>📷 ফসল পরীক্ষা করুন<span class="en">Check your crop</span></h2></div>
<main>
  <div class="card">
    <p class="bn">অসুস্থ পাতার একটি পরিষ্কার ছবি দিন (JPG বা PNG, সর্বোচ্চ ৫ MB)।</p>
    <p class="en">Upload a clear photo of the sick leaf (JPG or PNG, max 5 MB).</p>
    <input type="file" id="file" accept="image/png,image/jpeg" onchange="preview()">
    <img id="prev" class="thumb" style="display:none">
    <button onclick="send()">🔍 রোগ পরীক্ষা করুন<span class="en">Check disease</span></button>
    <p id="msg"></p>
  </div>
  <div id="result"></div>
</main>
<script src="/app.js"></script>
<script>
if (requireLogin()) renderNav();
function preview() {
  const f = file.files[0]; if (!f) return;
  prev.src = URL.createObjectURL(f); prev.style.display = "block";
}
async function send() {
  msg.innerHTML = ""; result.innerHTML = "";
  if (!file.files[0]) { msg.className = "msg"; msg.innerHTML = bi("আগে একটি ছবি বাছাই করুন।", "Please choose a photo first."); return; }
  const form = new FormData(); form.append("file", file.files[0]);
  msg.className = "ok"; msg.innerHTML = bi("পরীক্ষা চলছে...", "Checking...");
  try {
    const r = await api("/api/diagnose", { method: "POST", body: form });
    msg.innerHTML = "";
    const pct = Math.round(r.confidence * 100);
    result.innerHTML = `<div class="card">
      <h2>${r.disease_name_bn}<span class="en">${r.disease_name} (${r.crop})</span></h2>
      <p><b>নিশ্চয়তা / Confidence:</b> <span class="badge ${r.sure ? "" : "low"}">${pct}%</span></p>
      <div class="bar"><div style="width:${pct}%"></div></div>
      ${r.sure ? "" : `<div class="warn">⚠️ ${bi("এআই সম্পূর্ণ নিশ্চিত নয়। অনুগ্রহ করে কৃষি কর্মকর্তাকে দেখান।", "The AI is not very sure. Please show the plant to an agriculture officer.")}</div>`}
      <h3>🔎 লক্ষণ <span class="en">Symptoms</span></h3>
      <p class="bn">${r.symptoms_bn}</p><p class="en">${r.symptoms}</p>
      <h3>💊 কী করবেন <span class="en">What to do</span></h3>
      <p class="bn">${r.remedy_bn}</p><p class="en">${r.remedy}</p></div>`;
  } catch (e) { msg.className = "msg"; msg.innerHTML = bi("ছবি দেওয়া যায়নি (শুধু JPG/PNG, ৫ MB এর কম)", e.message); }
}
</script></body></html>
