<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KrishiSmart - Market Prices</title><link rel="stylesheet" href="/style.css"></head>
<body><nav id="nav"></nav>
<div class="page-title"><h2>💰 বাজারদর<span class="en">Market prices</span></h2></div>
<main>
  <div class="card">
    <div class="row">
      <div><label>ফসল <span class="en">Crop</span></label>
        <select id="crop" onchange="load()"><option value="">সব ফসল / All crops</option></select></div>
      <div><label>বাজার <span class="en">Market</span></label>
        <select id="market" onchange="load()"><option value="">সব বাজার / All markets</option></select></div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>ফসল<span class="en">Crop</span></th><th>বাজার<span class="en">Market</span></th>
      <th>দাম (৳/কেজি)<span class="en">Price (৳/kg)</span></th><th>তারিখ<span class="en">Date</span></th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <p class="bn" style="font-size:14px">দাম অ্যাডমিন নির্ভরযোগ্য বাজার সূত্র থেকে দেন।</p>
    <p class="en">Prices are entered by the admin from trusted market sources.</p>
  </div>
</main>
<script src="/app.js"></script>
<script>
renderNav();
async function init() {
  const m = await api("/api/prices/meta");
  m.crops.forEach(c => crop.add(new Option(c, c)));
  m.markets.forEach(x => market.add(new Option(x, x)));
  load();
}
async function load() {
  const q = "?crop=" + encodeURIComponent(crop.value) + "&market=" + encodeURIComponent(market.value);
  const list = await api("/api/prices" + q);
  rows.innerHTML = list.length ? list.map(p => `<tr><td><b>${p.crop}</b></td><td>${p.market}</td>
    <td><span class="badge">৳ ${p.price_per_kg}</span></td><td>${p.date}</td></tr>`).join("")
    : `<tr><td colspan='4'>${bi("কোনো দাম পাওয়া যায়নি।", "No prices found.")}</td></tr>`;
}
init();
</script></body></html>
