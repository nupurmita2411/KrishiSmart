<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KrishiSmart - Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><nav id="nav"></nav>
<div class="page-title"><h2>⚙️ অ্যাডমিন ড্যাশবোর্ড<span class="en">Admin dashboard</span></h2></div>
<main>
  <p id="msg" class="msg"></p>

  <div class="card"><h2>💰 বাজারদর যোগ করুন <span class="en">Add market price</span></h2>
    <div class="row">
      <input id="pcrop" placeholder="ফসল / Crop (Rice)"><input id="pmarket" placeholder="বাজার / Market">
      <input id="pprice" type="number" placeholder="কেজি প্রতি দাম / Price per kg"><input id="pdate" type="date">
    </div>
    <button onclick="addPrice()">সংরক্ষণ করুন<span class="en">Save price</span></button>
    <div class="scroll"><table>
      <thead><tr><th>ফসল<span class="en">Crop</span></th><th>বাজার<span class="en">Market</span></th>
      <th>৳/কেজি<span class="en">৳/kg</span></th><th>তারিখ<span class="en">Date</span></th><th></th></tr></thead>
      <tbody id="prices"></tbody></table></div>
  </div>

  <div class="card"><h2>🦠 রোগ ও প্রতিকার <span class="en">Disease & remedy</span></h2>
    <div class="row"><input id="did" placeholder="আইডি / id (rice_blast)"><input id="dcrop" placeholder="ফসল / Crop"><input id="dname" placeholder="রোগের নাম / Disease name"></div>
    <textarea id="dsym" placeholder="লক্ষণ / Symptoms"></textarea>
    <textarea id="drem" placeholder="প্রতিকার / Remedy steps"></textarea>
    <button onclick="addDisease()">সংরক্ষণ করুন<span class="en">Save disease</span></button>
    <div class="scroll"><table>
      <thead><tr><th>আইডি<span class="en">ID</span></th><th>নাম<span class="en">Name</span></th><th>ফসল<span class="en">Crop</span></th></tr></thead>
      <tbody id="diseases"></tbody></table></div>
  </div>

  <div class="card"><h2>👥 ব্যবহারকারী <span class="en">Users</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>নাম<span class="en">Name</span></th><th>ফোন<span class="en">Phone</span></th><th>ভূমিকা<span class="en">Role</span></th><th></th></tr></thead>
      <tbody id="users"></tbody></table></div>
  </div>
</main>
<script src="/app.js"></script>
<script>
if (requireLogin(true)) { renderNav(); loadAll(); }
const show = e => { msg.textContent = e.message; };
const delBtn = (fn, id) => `<button class="red" onclick="${fn}(${id})">মুছুন<span class="en">Delete</span></button>`;

async function loadAll() { loadPrices(); loadDiseases(); loadUsers(); }

async function loadPrices() {
  const list = await api("/api/prices");
  prices.innerHTML = list.map(p => `<tr><td>${p.crop}</td><td>${p.market}</td><td>${p.price_per_kg}</td><td>${p.date}</td>
    <td>${delBtn("delPrice", p.id)}</td></tr>`).join("");
}
async function addPrice() {
  try {
    await api("/api/admin/prices", { method: "POST", body: { crop: pcrop.value, market: pmarket.value,
      price_per_kg: parseFloat(pprice.value), date: pdate.value } });
    msg.textContent = ""; loadPrices();
  } catch (e) { show(e); }
}
async function delPrice(id) { await api("/api/admin/prices/" + id, { method: "DELETE" }); loadPrices(); }

async function loadDiseases() {
  const list = await api("/api/admin/diseases");
  diseases.innerHTML = list.map(d => `<tr><td>${d.id}</td><td>${d.name_bn || ""}<span class="en">${d.name}</span></td><td>${d.crop}</td></tr>`).join("");
}
async function addDisease() {
  try {
    await api("/api/admin/diseases", { method: "POST", body: { id: did.value, crop: dcrop.value,
      name: dname.value, symptoms: dsym.value, remedy: drem.value } });
    msg.textContent = ""; loadDiseases();
  } catch (e) { show(e); }
}

async function loadUsers() {
  const list = await api("/api/admin/users");
  users.innerHTML = list.map(u => `<tr><td>${u.name}</td><td>${u.phone}</td><td>${u.role}</td>
    <td>${u.role === "admin" ? "" : delBtn("delUser", u.id)}</td></tr>`).join("");
}
async function delUser(id) { await api("/api/admin/users/" + id, { method: "DELETE" }); loadUsers(); }
</script></body></html>
